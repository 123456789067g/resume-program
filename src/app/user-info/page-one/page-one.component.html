<form [formGroup]="form">
  <h2>Confirm User Basic Info</h2>

  <div class="form-row">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input id="firstName" formControlName="firstName" type="text" required />
      <div *ngIf="showError && form.get('firstName')?.invalid" class="error">
        First Name is required.
      </div>
    </div>
    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input id="lastName" formControlName="lastName" type="text" required />
      <div *ngIf="showError && form.get('lastName')?.invalid" class="error">
        Last Name is required.
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="phone">Phone</label>
    <input id="phone" formControlName="phone" type="text" required />
    <div *ngIf="showError && form.get('phone')?.invalid" class="error">
      Phone is required.
    </div>
  </div>

  <div class="form-group">
    <label for="userEmail">User Email</label>
    <input id="userEmail" formControlName="userEmail" type="email" required />
    <div *ngIf="showError && form.get('userEmail')?.invalid" class="error">
      Valid Email is required.
    </div>
  </div>

  <div class="form-group">
    <label for="street1">Street 1</label>
    <input id="street1" formControlName="street1" type="text" required />
    <div *ngIf="showError && form.get('street1')?.invalid" class="error">
      Street 1 is required.
    </div>
  </div>
  <div class="form-group">
    <label for="street2">Street 2</label>
    <input id="street2" formControlName="street2" type="text" />
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="city">City</label>
      <input id="city" formControlName="city" type="text" required />
      <div *ngIf="showError && form.get('city')?.invalid" class="error">
        City is required.
      </div>
    </div>
    <div class="form-group">
      <label for="state">State</label>
      <input id="state" formControlName="state" type="text" required />
      <div *ngIf="showError && form.get('state')?.invalid" class="error">
        State is required.
      </div>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="zipcode">Zipcode</label>
      <input id="zipcode" formControlName="zipcode" type="text" required />
      <div *ngIf="showError && form.get('zipcode')?.invalid" class="error">
        Zipcode is required.
      </div>
    </div>
    <div class="form-group">
      <label for="country">Country</label>
      <input id="country" formControlName="country" type="text" required />
      <div *ngIf="showError && form.get('country')?.invalid" class="error">
        Country is required.
      </div>
    </div>
  </div>

  <div class="button-container">
    <button type="button" (click)="onNext()">Next</button>
  </div>
</form>
