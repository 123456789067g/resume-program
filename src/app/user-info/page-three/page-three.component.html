<form [formGroup]="form">
  <h2>Confirm Working Info</h2>

  <div formArrayName="workingHistory">
    <div
      *ngFor="let work of workingHistory.controls; let i = index"
      [formGroupName]="i"
      class="work-entry"
    >      
      <div class="form-row">
        <div class="form-group">
          <label for="company-{{ i }}">Company</label>
          <input
            id="company-{{ i }}"
            formControlName="company"
            type="text"
            required
          />
          <div
            class="error"
            *ngIf="work.get('company')?.invalid && work.get('company')?.touched"
          >
            Company is required.
          </div>
        </div>

        <div class="form-group">
          <label for="title-{{ i }}">Title</label>
          <input
            id="title-{{ i }}"
            formControlName="title"
            type="text"
            required
          />
          <div
            class="error"
            *ngIf="work.get('title')?.invalid && work.get('title')?.touched"
          >
            Title is required.
          </div>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="startDate-{{ i }}">Start Date</label>
          <input
            id="startDate-{{ i }}"
            formControlName="startDate"
            type="date"
            required
          />
          <div
            class="error"
            *ngIf="
              work.get('startDate')?.invalid && work.get('startDate')?.touched
            "
          >
            Start Date is required.
          </div>
        </div>

        <div class="form-group">
          <label for="endDate-{{ i }}">End Date</label>
          <input
            id="endDate-{{ i }}"
            formControlName="endDate"
            type="date"
            required
          />
          <div
            class="error"
            *ngIf="work.get('endDate')?.invalid && work.get('endDate')?.touched"
          >
            End Date is required.
          </div>
        </div>
      </div>
      
      <div class="form-group">
        <label for="description-{{ i }}">Description</label>
        <textarea
          id="description-{{ i }}"
          formControlName="description"
          rows="4"
          required
        ></textarea>
        <div
          class="error"
          *ngIf="
            work.get('description')?.invalid && work.get('description')?.touched
          "
        >
          Description is required and cannot exceed 1000 characters.
        </div>
      </div>
      
      <div class="form-group">
        <label for="current-{{ i }}">Current</label>
        <select id="current-{{ i }}" formControlName="current" required>
          <option value="">Select</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
        <div
          class="error"
          *ngIf="work.get('current')?.invalid && work.get('current')?.touched"
        >
          Please select if this is your current job.
        </div>
      </div>
      
      <div class="remove-button-container">
        <button type="button" (click)="removeWorkExperience(i)">Remove</button>
      </div>
    </div>
  </div>
  
  <button type="button" (click)="addWorkExperience()">Add Work Experience</button>
  
  <div class="button-container">
    <button type="button" (click)="onPrevious()">Previous</button>
    <button type="button" (click)="onNext()" [disabled]="form.invalid">
      Next
    </button>
  </div>
</form>
