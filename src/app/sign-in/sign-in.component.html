<div data-collapse="medium" data-animation="default" data-duration="400" data-no-scroll="1" data-easing="ease" data-easing2="ease" role="banner" class="navbar w-nav">
  <div class="w-container">
    <a href="../index.html" class="logo-block w-nav-brand"><img src="../images/Logo.png" alt="" class="logo"></a>
    <nav role="navigation" class="nav-menu w-nav-menu">
      <a href="/about" class="nav-link light w-nav-link">About</a>
      <a href="/pricing" class="nav-link light w-nav-link">PRICING</a>
      <a href="/blog" class="nav-link light w-nav-link">BLOG</a>
      <a href="/contact" class="nav-link light w-nav-link">Contact</a>
      <a href="/sign-in" class="nav-link light w-nav-link">Sign in</a>
      <a href="/sign-up" class="nav-link light w-nav-link">Start For Free</a>
    </nav>
    <div class="transparant-menu-button w-nav-button">
      <div class="w-icon-nav-menu"></div>
    </div>
  </div>
</div>
<div class="full-sign-up-block">
  <div data-ix="fade-in-on-scroll" class="full-page-sign-up-form w-form">
    <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" id="wf-form-Sign-Up-Form" name="wf-form-Sign-Up-Form-1" data-name="Sign Up Form 1" method="post" data-wf-page-id="66cc532b67814a9c072a02f5" data-wf-element-id="6ae5efe5-d62a-2543-5ee1-c79081a95036">
      <h3 class="contact-form-title">Sign In</h3>
      <input formControlName="email" class="dark-field sign-up w-input" maxlength="256" name="Email-4" data-name="Email 4" placeholder="Email address" type="email" id="Email-4" required>
      <input formControlName="password" class="dark-field sign-up w-input" maxlength="256" name="password-3" data-name="Password 3" placeholder="Password" type="password" id="password-3" required>
      <div class="w-layout-vflex flex-block-3">
        <input type="submit" data-wait="Please wait..." class="button light w-button" value="Sign In">
        <a href="/sign-up" class="link">New User? Create Account Here</a>
        <a href="/forgot-password" class="link">Forgot Password</a>
      </div>
    </form>
    <div class="w-layout-vflex flex-block-4">
      <div id="g_id_onload"
           data-client_id="338799070138-v6dthhklf6rjf19kvaib84mhflrk3hgr.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse"
           data-auto_select="true">
      </div>

      <div class="facebook-btn w-embed w-script">
        <div id="fb-root"></div>
        <div class="fb-login-button" data-width="" data-size="large" data-button-type="login_with" data-layout="default" data-auto-logout-link="false" data-use-continue-as="false" onlogin="checkLoginState();"></div>
      </div>
    </div>
    <div class="success-message w-form-done">
      <p>Thank you! Your submission has been received!</p>
    </div>
    <div class="error-bg w-form-fail">
      <p>Oops! Something went wrong while submitting the form</p>
    </div>
  </div>
</div>
<script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=66a9c9b673d8c5f0c2e35202" type="text/javascript" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
