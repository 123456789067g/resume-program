<div class="full-sign-up-block"><div class="full-sign-up-block">
  <div class="full-page-sign-up-form w-form">
    <form (ngSubmit)="onSubmit()" #forgotPasswordForm="ngForm" novalidate>
      <h3 class="contact-form-title">Forgot Password</h3>
      <div class="input-container">
        <input
          class="dark-field sign-up w-input"
          maxlength="256"
          name="email"
          placeholder="Email address"
          type="email"
          id="Email-4"
          required
          [(ngModel)]="email"
        />
        <!-- Tooltip-style Error Message -->
        <div *ngIf="showTooltip" class="tooltip-error">
          Please enter a valid email address.
        </div>
      </div>
      <div class="w-layout-vflex flex-block-3">
        <button type="submit" class="button light w-button">
          Send Email
        </button>
      </div>
    </form>
    <div *ngIf="showMessage" class="temporary-message">
      A reset email will be sent to the email if it exists
    </div>
  </div>
</div>
